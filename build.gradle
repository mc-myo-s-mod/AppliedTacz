plugins {
    id 'base'
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven { url "https://cursemaven.com" }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            url = "https://modmaven.dev"
            content {
                includeGroup "appeng"
                includeGroup "de.mari_023"
            }
        }
    }
}

subprojects { subproject ->
    def propertiesFile = subproject.file('gradle.properties')
    if (propertiesFile.exists()) {
        def properties = new Properties()
        propertiesFile.withInputStream { properties.load(it) }
        properties.each { key, value ->
            if (!subproject.extensions.extraProperties.has(key.toString())) {
                subproject.extensions.extraProperties.set(key.toString(), value)
            }
        }
    }
}

def modProjects = [
        project(':forge-1.20.1'),
        project(':neoforge-1.21.1')
]

modProjects.each { modProject ->
    def commonJavaSourceDir = rootProject.layout.projectDirectory.dir('common/src/main/java')
    def commonResourcesSourceDir = rootProject.layout.projectDirectory.dir('common/src/main/resources')
    def generatedCommonJavaDir = modProject.layout.buildDirectory.dir('generated/sources/appliedTaCZCommon/java')
    def generatedCommonResourcesDir = modProject.layout.buildDirectory.dir('generated/resources/appliedTaCZCommon')

    def syncCommonJava = modProject.tasks.register('syncAppliedTaCZCommonJava', Sync) {
        from commonJavaSourceDir
        into generatedCommonJavaDir
    }

    def syncCommonResources = modProject.tasks.register('syncAppliedTaCZCommonResources', Sync) {
        from commonResourcesSourceDir
        into generatedCommonResourcesDir
    }

    modProject.plugins.withId('java') {
        modProject.sourceSets.main.java.srcDir(generatedCommonJavaDir)
        modProject.sourceSets.main.resources.srcDir(generatedCommonResourcesDir)

        modProject.tasks.named('compileJava').configure {
            dependsOn syncCommonJava
        }
        modProject.tasks.named('processResources').configure {
            dependsOn syncCommonResources
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

tasks.register('syncIntellij') {
    dependsOn ':forge-1.20.1:genIntellijRuns'
    dependsOn ':neoforge-1.21.1:neoForgeIdeSync'
}
